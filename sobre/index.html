    <script>
      try {
        const saved = JSON.parse(localStorage.getItem("portfolio-accessibility") || "{}");
        document.documentElement.dataset.theme = saved.theme === "light" ? "light" : "dark";
        document.documentElement.dataset.contrast = saved.highContrast ? "high" : "normal";
        document.documentElement.dataset.motion = saved.reduceMotion ? "reduce" : "full";
        document.documentElement.dataset.links = saved.underlineLinks ? "underlined" : "default";
        document.documentElement.style.setProperty("--font-scale", String(saved.fontScale || 1));
        const language = localStorage.getItem("portfolio-language");
        document.documentElement.lang = language === "en" ? "en-US" : "pt-BR";
      } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
